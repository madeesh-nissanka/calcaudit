[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "geoaudit"
version = "0.1.0"
description = "Consistency checks for engineering documents: units, equations and derivations."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Madeesh P. Nissanka"}]
dependencies = []

[project.scripts]
geoaudit = "geoaudit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
geoaudit = ["cards/*.json"]
